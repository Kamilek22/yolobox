<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlay – Tipply + Botrix</title>
  <style>
    body { 
      background-color: rgba(0, 0, 0, 0); 
      margin: 0px auto; 
      overflow: hidden; 
    }

    /* --- Tipply: cel donate (ustawione na stałe) --- */
    .tipply-goal {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    .tipply-goal iframe {
      border: 0;
      background: transparent;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      transform: translate(-22px, 725px) scale(1);
    }

    /* --- Botrix: alerty (na środku) --- */
    .botrix-alerts {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    .botrix-alerts iframe {
      border: 0;
      background: transparent;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <!-- Tipply goal -->
  <div class="tipply-goal">
    <iframe
      src="https://widgets.tipply.pl/TIPS_GOAL/45acbc83-f00e-41a6-bbcd-4e8078ae7923/GOAL/284aa312-53e1-460c-8424-70880828c41b"
      allowtransparency="true"
      scrolling="no"
      referrerpolicy="no-referrer">
    </iframe>
  </div>

  <!-- Botrix alerts -->
  <div class="botrix-alerts">
    <iframe
      src="https://botrix.live/alerts?bid=mImY0SOSfEEnIbMs4UPHNg"
      allowtransparency="true"
      scrolling="no"
      referrerpolicy="no-referrer">
    </iframe>
  </div>
</body>
</html>
