<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tipply – Cel donate</title>
  <style>
    body { 
      background-color: rgba(0, 0, 0, 0); 
      margin: 0px auto; 
      overflow: hidden; 
    }

    .root { 
      position: fixed; 
      inset: 0; 
      display: grid; 
      place-items: center; 
    }

    iframe {
      border: 0;
      background: transparent;
      width: 1920px;   /* pełne płótno Tipply */
      height: 1080px;
      transform-origin: top left;
      transform: translate(-22px, 715px) scale(1); /* przesunięte o 30px w dół */
    }
  </style>
</head>
<body>
  <div class="root">
    <iframe
      src="https://widgets.tipply.pl/TIPS_GOAL/45acbc83-f00e-41a6-bbcd-4e8078ae7923/GOAL/284aa312-53e1-460c-8424-70880828c41b"
      allowtransparency="true"
      scrolling="no"
      referrerpolicy="no-referrer"
    ></iframe>
  </div>
</body>
</html>
