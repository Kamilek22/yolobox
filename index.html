<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlay 1080p – Tipply Goal</title>
  <style>
    :root{
      /* USTAWIENIA: dopasuj pozycję/skalę widgetu */
      --goal-x: 32px;      /* odsunięcie od lewej krawędzi */
      --goal-y: 32px;      /* odsunięcie od dolnej krawędzi */
      --goal-scale: 1;     /* 0.5 = 50%, 1 = 100%, 1.2 = 120% itd. */
      --stage-w: 1920px;
      --stage-h: 1080px;
    }

    /* Pełnoekranowa, przezroczysta scena */
    html, body { height: 100%; }
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* „Scena” 1920×1080 (YoloBox przeglądarka też powinna mieć 1080p) */
    .stage {
      position: fixed;
      inset: 0;
      width: var(--stage-w);
      height: var(--stage-h);
      margin: auto;
      background: transparent;
      pointer-events: none; /* overlay nie łapie klików */
    }

    /* Kontener celu donate – lewy dolny róg */
    .goal {
      position: absolute;
      left: var(--goal-x);
      bottom: var(--goal-y);
      transform-origin: bottom left;
      transform: scale(var(--goal-scale));
      z-index: 10;
    }

    /* Sam iframe */
    .goal iframe {
      display: block;
      border: 0;
      width: 600px;   /* bazowe wymiary – zmieniaj skalą powyżej */
      height: 220px;  /* dopasuj jeśli chcesz, ale lepiej skalą */
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <div class="goal">
      <iframe
        src="https://widgets.tipply.pl/TIPS_GOAL/45acbc83-f00e-41a6-bbcd-4e8078ae7923/GOAL/284aa312-53e1-460c-8424-70880828c41b"
        allowtransparency="true"
        scrolling="no">
      </iframe>
    </div>
  </div>
</body>
</html>
