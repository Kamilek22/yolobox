<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tipply – Cel donate</title>
  <style>
    body {
      background-color: rgba(0, 0, 0, 0);
      margin: 0;
      overflow: hidden;
    }

    /* Cel donate w prawym dolnym rogu */
    #tipply-goal {
      position: fixed;
      bottom: 20px;   /* odległość od dołu ekranu */
      right: 20px;    /* odległość od prawej */
      border: 0;
      background: transparent;
      width: 500px;   /* szerokość widgetu */
      height: 150px;  /* wysokość widgetu */
      pointer-events: none;
    }
  </style>
</head>
<body>
  <iframe
    id="tipply-goal"
    src="https://widgets.tipply.pl/TIPS_GOAL/45acbc83-f00e-41a6-bbcd-4e8078ae7923/GOAL/284aa312-53e1-460c-8424-70880828c41b"
    allowtransparency="true"
    scrolling="no"
    referrerpolicy="no-referrer"
  ></iframe>
</body>
</html>
