<!-- File: overlays/botrix_tipply_goal.html -->
<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Botrix + Tipply Goal Overlay</title>
  <style>
    /* Przezroczyste tło do miksowania w OBS */
    html, body { margin: 0; padding: 0; background: transparent; height: 100%; overflow: hidden; }
    #root { position: relative; width: 100vw; height: 100vh; }

    /* Botrix zajmuje cały ekran, pod spodem */
    #botrix {
      position: absolute; inset: 0; border: 0; z-index: 1;
      background: transparent;
    }

    /* Tipply nad alertami, w rogu; domyślnie TR */
    #tipply-goal {
      position: absolute; border: 0; z-index: 2;
      background: transparent;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,.35));
      /* brak pointer-events, bo nie klikamy w OBS */
      pointer-events: none;
      transform-origin: top left;
    }

    /* Lekka plakietka diagnostyczna */
    #debug {
      position: absolute; left: 8px; bottom: 8px; z-index: 99;
      font: 12px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #eee; background: rgba(20,20,20,.7); padding: 6px 8px; border-radius: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="root">
    <iframe id="botrix" allow="autoplay; clipboard-read; clipboard-write" allowtransparency="true"></iframe>
    <iframe id="tipply-goal" allow="autoplay" allowtransparency="true"></iframe>
    <div id="debug"></div>
  </div>

  <script>
    // Minimalne komentarze "dlaczego": zapewniamy łatwe strojenie w OBS bez edycji pliku.

    const params = new URLSearchParams(location.search);

    // Twoje domyślne linki (można nadpisać parametrami ?botrix=...&goal=...)
    const DEFAULT_BOTRIX = "https://botrix.live/alerts?bid=mImY0SOSfEEnIbMs4UPHNg";
    const DEFAULT_TIPPLY_GOAL = "https://widgets.tipply.pl/TIPS_GOAL/45acbc83-f00e-41a6-bbcd-4e8078ae7923/GOAL/284aa312-53e1-460c-8424-70880828c41b";

    const botrixUrl = safeUrl(params.get("botrix") || DEFAULT_BOTRIX);
    const goalUrl   = safeUrl(params.get("goal")   || DEFAULT_TIPPLY_GOAL);

    // Pozycjonowanie i rozmiar celu
    const goalPos   = (params.get("goalPos") || "top-right").toLowerCase(); // top-right | top-left | bottom-right | bottom-left | custom
    const goalX     = toNum(params.get("goalX"), 24);   // px od lewej (dla custom) lub od krawędzi wynikowej
    const goalY     = toNum(params.get("goalY"), 24);   // px od góry (dla custom) lub od krawędzi wynikowej
    const goalW     = toNum(params.get("goalW"), 420);  // bazowa szerokość
    const goalH     = toNum(params.get("goalH"), 140);  // bazowa wysokość
    const goalScale = clamp(toNum(params.get("goalScale"), 1), 0.25, 4);

    // Debug
    const debugOn = params.get("debug") === "1";

    const botrixIframe = document.getElementById("botrix");
    const tipplyIframe = document.getElementById("tipply-goal");
    const debugBox = document.getElementById("debug");

    // Cache-buster (ważne w OBS po zmianach)
    botrixIframe.src = withCacheBuster(botrixUrl);
    tipplyIframe.src = withCacheBuster(goalUrl);

    // Botrix: pełny ekran
    Object.assign(botrixIframe.style, { width: "100%", height: "100%" });

    // Tipply: rozmiar + skala
    Object.assign(tipplyIframe.style, {
      width: `${goalW}px`,
      height: `${goalH}px`,
      transform: `scale(${goalScale})`
    });

    // Ustal rogi lub custom
    applyCornerPosition(tipplyIframe, goalPos, goalX, goalY);

    // Prosty status ładowania (do diagnostyki)
    let botrixReady = false, tipplyReady = false;
    botrixIframe.addEventListener("load", () => { botrixReady = true; renderDebug(); }, { once: true });
    tipplyIframe.addEventListener("load", () => { tipplyReady = true; renderDebug(); }, { once: true });

    // Awaryjny reload, jeśli któreś nie wstanie
    setTimeout(() => {
      if (!botrixReady) botrixIframe.src = withCacheBuster(botrixUrl);
      if (!tipplyReady) tipplyIframe.src = withCacheBuster(goalUrl);
    }, 7000);

    function applyCornerPosition(el, pos, x, y) {
      const corners = ["top-left","top-right","bottom-left","bottom-right"];
      // Reset
      el.style.top = el.style.right = el.style.bottom = el.style.left = "auto";

      if (pos === "custom") { el.style.left = `${x}px`; el.style.top = `${y}px`; return; }

      if (!corners.includes(pos)) pos = "top-right";
      const [v, h] = pos.split("-");
      el.style[v] = `${y}px`;
      el.style[h === "right" ? "right" : "left"] = `${x}px`;
    }

    function withCacheBuster(url) {
      try {
        const u = new URL(url);
        u.searchParams.set("_cb", String(Date.now()));
        return u.toString();
      } catch {
        // W razie braku absolutnego URL (ale tu i tak mamy absolutne)
        const sep = url.includes("?") ? "&" : "?";
        return `${url}${sep}_cb=${Date.now()}`;
      }
    }

    function safeUrl(u) {
      // Prosta ochrona: tylko http(s)
      if (!/^https?:\/\//i.test(u)) throw new Error("Nieprawidłowy URL.");
      return u;
    }

    function toNum(val, fallback) {
      const n = Number(val);
      return Number.isFinite(n) ? n : fallback;
    }

    function clamp(n, min, max) {
      return Math.min(max, Math.max(min, n));
    }

    function renderDebug() {
      if (!debugOn) return;
      debugBox.style.display = "block";
      debugBox.textContent = `Botrix: ${botrixReady ? "OK" : "…"} | Tipply Goal: ${tipplyReady ? "OK" : "…"} | ${screen.width}x${screen.height}`;
    }

    // Uwaga: jeśli któraś usługa zabrania osadzania (X-Frame-Options/CSP), nie obejdziemy tego w przeglądarce/OBS.
  </script>
</body>
</html>
