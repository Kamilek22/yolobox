<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tipply – Cel donate</title>
  <style>
    body { margin:0; background:transparent; overflow:hidden; }

    .goal {
      position: fixed;
      right: 20px;    /* zmień na left:20px; jeśli chcesz lewy dół */
      bottom: 20px;
      width: 520px;   /* szerokość widocznego paska */
      height: 140px;  /* wysokość widocznego paska */
      overflow: hidden;
      pointer-events: none;
    }

    .goal iframe {
      position: absolute;
      top: 0; left: 0;
      width: 1920px;   /* zakładamy płótno fullHD */
      height: 1080px;
      border: 0;
      background: transparent;
      transform-origin: top left;

      /* Twoje wartości z debug */
      transform: translate(-22px, 685px) scale(1);
    }
  </style>
</head>
<body>
  <div class="goal">
    <iframe
      src="https://widgets.tipply.pl/TIPS_GOAL/45acbc83-f00e-41a6-bbcd-4e8078ae7923/GOAL/284aa312-53e1-460c-8424-70880828c41b"
      allowtransparency="true"
      scrolling="no"
      referrerpolicy="no-referrer">
    </iframe>
  </div>
</body>
</html>
