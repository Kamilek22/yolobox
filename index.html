<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlay – Tipply + Botrix</title>
  <style>
    body { 
      background-color: rgba(0,0,0,0); 
      margin: 0; 
      overflow: hidden; 
    }

    /* --- Tipply: cel donate (prawy dół, ustalone) --- */
    .tipply-goal {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    .tipply-goal iframe {
      border: 0;
      background: transparent;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      transform: translate(-22px, 725px) scale(1);
    }

    /* --- Botrix: alerty, idealnie środek ekranu --- */
    .botrix-alerts {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .botrix-alerts iframe {
      border: 0;
      background: transparent;
      width: 1920px;   /* pełne płótno */
      height: 1080px;
      transform-origin: top center;
      transform: translateY(360px); 
    }

    /* --- Tipply: powiadomienie donate (tak samo jak Botrix) --- */
    .tipply-alert {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .tipply-alert iframe {
      border: 0;
      background: transparent;
      width: 1920px;
      height: 1080px;
      transform-origin: top center;
      transform: translateY(360px);
    }

    /* --- Tipply: Top 3 donate --- */
    .tipply-top3 {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      pointer-events: none;
    }
    .tipply-top3 iframe {
      border: 0;
      background: transparent;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      transform: translate(-5px, 20px) scale(0.8);
    }
  </style>
</head>
<body>
  <!-- Tipply goal (prawy dół) -->
  <div class="tipply-goal">
    <iframe
      src="https://widgets.tipply.pl/TIPS_GOAL/45acbc83-f00e-41a6-bbcd-4e8078ae7923/GOAL/284aa312-53e1-460c-8424-70880828c41b"
      allowtransparency="true"
      scrolling="no"
      referrerpolicy="no-referrer">
    </iframe>
  </div>

  <!-- Botrix alerts -->
  <div class="botrix-alerts">
    <iframe
      src="https://botrix.live/alerts?bid=mImY0SOSfEEnIbMs4UPHNg"
      allowtransparency="true"
      scrolling="no"
      referrerpolicy="no-referrer">
    </iframe>
  </div>

  <!-- Tipply donate alert -->
  <div class="tipply-alert">
    <iframe
      src="https://widgets.tipply.pl/TIP_ALERT/45acbc83-f00e-41a6-bbcd-4e8078ae7923"
      allowtransparency="true"
      scrolling="no"
      referrerpolicy="no-referrer">
    </iframe>
  </div>

  <!-- Tipply top 3 donate -->
  <div class="tipply-top3">
    <iframe
      src="https://widgets.tipply.pl/LARGEST_MESSAGES/45acbc83-f00e-41a6-bbcd-4e8078ae7923/7e2ac059-e6d8-448f-8a00-99a8bbd85780"
      allowtransparency="true"
      scrolling="no"
      referrerpolicy="no-referrer">
    </iframe>
  </div>
</body>
</html>
