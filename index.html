<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlay – cel donate</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    object {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: none;
      width: 800px;   /* możesz zmienić wielkość */
      height: 200px;  /* dopasuj do widgetu */
      background: transparent;
    }
  </style>
</head>
<body>
  <object type="text/html" 
    data="https://widgets.tipply.pl/TIPS_GOAL/45acbc83-f00e-41a6-bbcd-4e8078ae7923/GOAL/284aa312-53e1-460c-8424-70880828c41b">
  </object>
</body>
</html>
